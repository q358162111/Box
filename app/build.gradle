apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
// kapt 仅为 andserver-processor 保留(不支持 KSP);Room/Glide 已迁移 KSP
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.yanzhenjie.andserver'

def static buildTime() {
    return new Date().format("yyyyMMdd_HHmm", TimeZone.getTimeZone("GMT+08:00"))
}

def static versionCodeFromBuildTime() {
    String t = buildTime()
    // yyMMddHH，随每次构建递增且不超过 int 上限
    return Integer.parseInt(t.substring(2, 8) + t.substring(9, 11))
}

android {
    namespace 'com.github.tvbox.osc'
    compileSdk 35

    defaultConfig {
        applicationId 'com.github.tvbox.osc.tk'
        targetSdkVersion 28
        versionCode versionCodeFromBuildTime()
        versionName "1.0.".concat(buildTime())
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    // 签名配置：keystore 文件本体(未入库,已在 .gitignore)与密码均不落库。
    // 密码来源优先级：环境变量 BOX_KEYSTORE_PASSWORD / BOX_KEY_ALIAS / BOX_KEY_PASSWORD
    //              > 根目录 keystore.properties(已 .gitignore,不入库)。
    // 本地/CI 构建前按需提供其一；release 缺密码时签名任务会失败并给出明确提示。
    def ksFile = rootProject.file("test.keystore")
    def ksStorePassword = System.getenv("BOX_KEYSTORE_PASSWORD")
    def ksKeyAlias = System.getenv("BOX_KEY_ALIAS")
    def ksKeyPassword = System.getenv("BOX_KEY_PASSWORD")
    def ksPropsFile = rootProject.file("keystore.properties")
    if (ksPropsFile.exists()) {
        def ksProps = new Properties()
        ksPropsFile.withInputStream { ksProps.load(it) }
        if (ksStorePassword == null) ksStorePassword = ksProps.getProperty("storePassword")
        if (ksKeyAlias == null) ksKeyAlias = ksProps.getProperty("keyAlias")
        if (ksKeyPassword == null) ksKeyPassword = ksProps.getProperty("keyPassword")
    }
    if (ksStorePassword == null) ksStorePassword = ""
    if (ksKeyAlias == null) ksKeyAlias = ""
    if (ksKeyPassword == null) ksKeyPassword = ksStorePassword
    signingConfigs {
        release {
            storeFile ksFile
            storePassword ksStorePassword
            keyAlias ksKeyAlias
            keyPassword ksKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
        }
    }

    flavorDimensions += ["abi", "brand", "mode"]
    productFlavors {
        armeabi {
            dimension = "abi"
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        arm64 {
            dimension = "abi"
            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        generic  {
            //通用版本
            dimension = "brand"
        }

        hisense {
            //海信的
            applicationId 'com.github.hisense.osc.tk'
            dimension = "brand"
        }
        normal {
            dimension = "mode"
            minSdkVersion 27
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        python {
            dimension = "mode"
            minSdkVersion 27
            // Python 版本需要额外的 Proguard 规则
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-python.pro'
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def flavorNames = variant.productFlavors.collect { it.name == "normal" ? "java" : it.name }.join('-')
            // 构建自定义文件名
            def fileName = "TVBox_${variant.buildType.name}-${flavorNames}.apk"
            outputFileName = fileName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'UnsafeOptInUsageError'
        // targetSdk 28 为有意保持：TV 应用依赖旧运行时行为（scoped storage 等），非疏忽
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    api fileTree(dir: "libs", include: ['*.jar', '*.aar'])
    implementation libs.kotlin.stdlib
    // for WebDAV
    implementation(libs.sardine.android) {
        exclude group: 'com.squareup.okhttp3'
    }
    implementation libs.nanohttpd
    implementation libs.nanohttpd.websocket
    implementation libs.zxing
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.extensions
    implementation libs.androidx.recyclerview
    implementation libs.androidx.material
    implementation project(path: ':quickjs')
    pythonImplementation project(":pyramid")

    ksp libs.androidx.room.compiler
    implementation libs.flowLayout
    implementation libs.androidx.room.runtime
    implementation libs.okhttp
    implementation libs.okhttp.dnsoverhttps
    implementation libs.baseRecyclerViewAdapterHelper
    implementation libs.loadsir
    implementation libs.gson
    implementation libs.glide
    ksp libs.glide.compiler
    implementation libs.autosize
    implementation(libs.xstream) {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation libs.eventbus
    implementation libs.hawk
    implementation libs.retrofuture
    implementation libs.androidx.annotation
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.ui
    implementation libs.androidx.media3.dash
    implementation libs.androidx.media3.hls
    implementation libs.androidx.media3.rtsp
    implementation libs.androidx.media3.rtmp
    implementation libs.androidx.media3.common
    implementation libs.nextlib.media3ext

    implementation libs.aliyun.player
    implementation libs.alivc.conan
    implementation libs.dkplayer.ui
    implementation libs.videocache

    implementation libs.okgo
    implementation(libs.tv.recyclerview) {
        // vlayout 传递引用旧 support 库,与 androidx.core 冲突
        exclude group: 'com.alibaba.android', module: 'vlayout'
    }
    implementation libs.utilcodex
    implementation libs.xxpermissions
    implementation libs.jsoup
    implementation libs.file.chooser
    implementation libs.commons.io
    implementation libs.juniversalchardet
//    implementation files('libs/thunder.jar')
    implementation libs.commons.lang3
    implementation libs.viewpump
    implementation libs.calligraphy3
    implementation libs.andserver.api
    kapt libs.andserver.processor
    implementation libs.danmaku
    implementation(libs.simple.xml) {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
    }
    configurations {
        configureEach {
            exclude group: 'xpp3', module: 'xpp3'
        }
    }
}