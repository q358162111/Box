// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "2.0.21"
    repositories {
        maven { url "https://maven.aliyun.com/repository/public" } // 国内镜像优先，规避 gradlePluginPortal 下载僵死
        maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
        mavenLocal() // Gradle 在线下载偶发僵死时，手动预置的构件可从本地 maven 仓库取用
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/releases" }
        maven { url "https://storage.googleapis.com/r8-releases/raw" }
        maven { url "https://chaquo.com/maven" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.0.21-1.0.28"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath 'com.yanzhenjie.andserver:plugin:2.1.12'
        classpath "com.chaquo.python:gradle:12.0.1"
    }
}

allprojects {
    repositories {
        maven { url "https://maven.aliyun.com/repository/public" } // 国内镜像优先
        mavenLocal() // 同上：优先使用本地预置构件
        // 项目内本地仓库：预置因网络/DNS 问题无法从 jitpack 稳定下载的构件（如 nextlib-media3ext）
        maven { url "$rootDir/local-maven" }
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/releases" }
        gradlePluginPortal()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
